<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="site-text.js"></script>
<script src="fx.js"></script>
<title data-t="admin.pageTitle"></title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:1rem;font-family:'Courier Prime','Courier New',monospace;background:#dce8f0;color:#111}
h1{margin:0;font:700 clamp(1.7rem,5vw,2.4rem)/1.1 'Playfair Display',Georgia,serif}
.hidden{display:none!important}
.pill{background:#d3e3ef;border:0;border-radius:.6rem;padding:.55rem 1rem;font:700 .85rem 'Playfair Display',Georgia,serif;cursor:pointer;transition:background .2s}
.pill:hover{background:#c3d9ea}
#login{max-width:24rem;margin:6rem auto 0;background:#fff;border-radius:1.5rem;padding:2rem}
#login input{display:block;width:100%;margin:.4rem 0 1rem;padding:.75rem;border:1px solid #ccc;border-radius:.75rem;font:inherit}
#login .pill{width:100%}
.err{min-height:1.2em;margin:.8rem 0 0;font-size:.85rem;color:#7a1d1d}
#dash{max-width:72rem;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:1rem}
.bar div{display:flex;gap:.5rem}
#msg{min-height:1.3em;font-size:.85rem;margin:0 0 .6rem}
.wrap{background:#fff;border-radius:1.5rem;overflow-x:auto}
table{width:100%;min-width:980px;border-collapse:collapse}
th,td{padding:.75rem;text-align:left;vertical-align:top;font-size:.8rem}
th{font:700 .85rem 'Playfair Display',Georgia,serif;white-space:nowrap}
tbody tr{border-top:1px solid #e5e5e5}
select{padding:.3rem;border:1px solid #ccc;border-radius:.5rem;font:inherit}
</style>
</head>
<body>
<main id="login">
  <h1 data-t="admin.loginHeading"></h1>
  <form id="loginForm">
    <label for="pw" style="display:block;margin-top:1.2rem;font-size:.9rem" data-t="admin.passwordLabel"></label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="pill" type="submit" data-t="admin.signIn"></button>
    <p id="loginErr" class="err"></p>
  </form>
</main>
<main id="dash" class="hidden">
  <div class="bar"><h1 data-t="admin.bookingsHeading"></h1><div><button id="refresh" class="pill" data-t="admin.refresh"></button><button id="logout" class="pill" data-t="admin.signOut"></button></div></div>
  <p id="msg" role="status"></p>
  <div class="wrap"><table>
    <thead><tr id="bkHead"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <h1 style="margin:2rem 0 1rem" data-t="admin.reviewsHeading"></h1>
  <div class="wrap"><table style="min-width:640px">
    <thead><tr id="rvHead"></tr></thead>
    <tbody id="revRows"></tbody>
  </table></div>
</main>
<script src="text-loader.js"></script>
<script>
[["bkHead","bookingHeaders"],["rvHead","reviewHeaders"]].forEach(function(p){TEXT.admin[p[1]].forEach(function(h){var th=document.createElement("th");th.textContent=h;document.getElementById(p[0]).appendChild(th)})});
var STATUSES=['Pending','Confirmed','Completed','Cancelled'];
var $=function(i){return document.getElementById(i)};
var getToken=function(){return sessionStorage.getItem('adminToken')};

// Authenticated fetch. A 401 returns the user to the login box.
async function api(path,opts){
  opts=opts||{};
  var res=await fetch('/api/admin'+path,Object.assign({},opts,{headers:{'Content-Type':'application/json',Authorization:'Bearer '+getToken()}}));
  if(res.status===401){logout(T('admin.wrongPassword'));throw new Error('Unauthorized')}
  if(!res.ok)throw new Error((await res.json().catch(function(){return{}})).error||T('admin.requestFailed'));
  return res.json();
}
function logout(err){
  sessionStorage.removeItem('adminToken');
  $('dash').classList.add('hidden');$('login').classList.remove('hidden');$('loginErr').textContent=err||'';
}
function say(t){$('msg').textContent=t}
function cell(tr,t){var td=tr.insertCell();td.textContent=t;return td}

// Rows are built with textContent so booking data can never inject HTML.
function render(list){
  var tb=$('rows');tb.innerHTML='';
  if(!list.length){cell(tb.insertRow(),T('admin.noBookings')).colSpan=8;return}
  list.forEach(function(b){
    var tr=tb.insertRow();
    cell(tr,b.id);
    var who=cell(tr,b.name);who.append(document.createElement('br'),b.whatsapp||b.phone||'');
    var pk=cell(tr,b.packageName||'');
    (b.items||[]).forEach(function(l){pk.append(document.createElement('br'),l.label+': '+inr(l.amount))});
    if(b.request)pk.append(document.createElement('br'),T('admin.requestLine',{text:b.request}));
    cell(tr,b.date).append(document.createElement('br'),(b.children?T('admin.peopleWithChildrenLine',{n:b.people||0,kids:b.children}):T('admin.peopleLine',{n:b.people||0})));
    var pay=cell(tr,T('admin.totalLine',{amount:inr(b.total||0)}));
    pay.append(document.createElement('br'),T('admin.advanceLine',{amount:inr(b.advance||0),method:String(b.payMethod||'').toUpperCase()}),document.createElement('br'),T('admin.balanceLine',{amount:inr(b.balance||0)}));
    var rc=tr.insertCell();
    if(typeof b.receipt==='string'&&/^data:image\/(jpeg|png);base64,/.test(b.receipt)){var im=new Image();im.src=b.receipt;im.alt=T('admin.receiptAlt');im.style.cssText='width:110px;border:1px solid #ccc;background:#fff';rc.append(im)}
    else if(typeof b.receipt==='string'&&/^data:application\/pdf;base64,/.test(b.receipt)){var a=document.createElement('a');a.href=b.receipt;a.download='receipt-'+b.id+'.pdf';a.textContent=T('admin.downloadPdf');rc.append(a)}
    var sel=document.createElement('select');
    STATUSES.forEach(function(s){sel.add(new Option((TEXT.admin.statusLabels||{})[s]||s,s,false,s===b.status))});
    sel.onchange=async function(){
      try{await api('/bookings/'+encodeURIComponent(b.id),{method:'PUT',body:JSON.stringify({status:sel.value})});say(T('admin.statusChanged',{id:b.id,status:(TEXT.admin.statusLabels||{})[sel.value]||sel.value}))}
      catch(e){say(e.message);load()}
    };
    cell(tr,'').append(sel);
    var del=document.createElement('button');del.textContent=T('admin.deleteButton');del.className='pill';
    del.onclick=async function(){
      if(!confirm(T('admin.confirmDeleteBooking',{id:b.id})))return;
      try{await api('/bookings/'+encodeURIComponent(b.id),{method:'DELETE'});say(T('admin.bookingDeleted',{id:b.id}));load()}
      catch(e){say(e.message)}
    };
    cell(tr,'').append(del);
  });
}
function renderReviews(list){
  var tb=$('revRows');tb.innerHTML='';
  if(!list.length){cell(tb.insertRow(),T('admin.noReviews')).colSpan=5;return}
  list.forEach(function(r){
    var tr=tb.insertRow();
    cell(tr,(r.createdAt||'').slice(0,10));
    cell(tr,'★'.repeat(r.rating)+'☆'.repeat(5-r.rating));
    cell(tr,r.name||T('admin.noName'));cell(tr,r.comment||T('admin.ratingOnly'));
    var del=document.createElement('button');del.textContent=T('admin.deleteButton');del.className='pill';
    del.onclick=async function(){
      if(!confirm(T('admin.confirmDeleteReview')))return;
      try{await api('/feedback/'+encodeURIComponent(r.id),{method:'DELETE'});say(T('admin.reviewRemoved'));load()}catch(e){say(e.message)}
    };
    cell(tr,'').append(del);
  });
}
async function load(){
  say(T('admin.loading'));
  try{var res=await Promise.all([api('/bookings'),api('/feedback')]);render(res[0]);renderReviews(res[1]);say('')}
  catch(e){if(e.message!=='Unauthorized')say(e.message)}
}
function showDash(){$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();sessionStorage.setItem('adminToken',$('pw').value);$('pw').value='';$('loginErr').textContent='';showDash();
});
$('refresh').onclick=load;
$('logout').onclick=function(){logout()};
if(getToken())showDash();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="site-text.js"></script>
<title data-t="policy.pageTitle"></title>
<meta name="description" content="" data-ta="content={policy.metaDescription}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--hd1:#2b5f86;--hd2:#4f8fb8;--bg:#fff;--ink:#16202a;--soft:#4b5a68;--line:#e3ebf1;--chip:#eef4f8;--accent:#2b5f86;--sans:'Jost','Helvetica Neue',Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--hd1:#13324b;--hd2:#1f4c70;--bg:#0f1a24;--ink:#f1f5f8;--soft:#aab8c4;--line:#22313e;--chip:#182733;--accent:#8cc3e6}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:linear-gradient(160deg,var(--hd1),var(--hd2)) fixed;min-height:100vh}
h1,h2,p,ul{margin:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
.hd{padding:max(1rem,env(safe-area-inset-top)) 1.3rem 1.5rem;color:#fff}
.back{display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:1.2rem;transition:background .2s}
.back:hover{background:rgba(255,255,255,.3)}
.hello{margin-top:1.1rem;font:600 clamp(1.3rem,5vw,1.7rem)/1.2 var(--sans)}
.hello-sub{margin-top:.3rem;font:400 clamp(.95rem,3.4vw,1.05rem)/1.4 var(--sans);opacity:.92}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;padding:1.6rem 1.4rem calc(2.4rem + env(safe-area-inset-bottom));min-height:70vh;box-shadow:0 -10px 30px rgba(0,0,0,.12);animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.title{font:600 clamp(1.7rem,6vw,2.2rem)/1.1 var(--sans)}
.upd{margin-top:.35rem;font-size:.85rem;color:var(--accent)}
.lead{margin-top:1.1rem;font-size:1rem;line-height:1.6;color:var(--soft)}
.cl{margin-top:1.5rem}
.cl h2{font:600 1.1rem/1.3 var(--sans);color:var(--ink)}
.cl p{margin-top:.4rem;font-size:.98rem;line-height:1.65;color:var(--soft)}
.cl p b{color:var(--ink);font-weight:600}
.subs{list-style:none;padding:0;margin-top:.5rem;display:grid;gap:.1rem}
.subs li{display:flex;gap:.6rem}
.subs .sn{flex:none;width:1.6rem;margin-top:.4rem;font-size:.95rem;font-weight:600;color:var(--accent)}
.subs li p{flex:1;margin-top:.4rem}
.end{margin-top:2rem;padding:1rem 1.1rem;border-radius:16px;background:var(--chip);font-size:.95rem;line-height:1.6;color:var(--soft)}
.thanks{margin-top:1.4rem;text-align:center;font-size:.95rem;color:var(--accent);letter-spacing:.04em}
@media(min-width:760px){body{padding-top:1.5rem}.wrap{border-radius:26px;overflow:hidden}.sheet{min-height:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="hd">
  <a class="back" href="javascript:history.length>1?history.back():location.href='book.html'" data-ta="aria-label={policy.backAria}">&#8592;</a>
  <h1 class="hello" data-t="policy.topHeading"></h1>
  <p class="hello-sub" data-t="policy.topSub"></p>
</header>
<main class="sheet">
  <h2 class="title" data-t="policy.bigTitle"></h2>
  <p class="upd" data-t="policy.subTitle"></p>
  <div id="policySections"></div>
</main>
</div>
<script src="text-loader.js"></script>
<script>
(function(){
  var box=document.getElementById('policySections');
  TEXT.policy.sections.forEach(function(s){
    var sec=document.createElement('section');sec.className='cl';
    var h=document.createElement('h2');h.textContent=s.title;sec.append(h);
    var ul=document.createElement('ul');ul.className='subs';
    s.points.forEach(function(p){
      var li=document.createElement('li'),b=document.createElement('span'),pp=document.createElement('p');
      b.className='sn';b.textContent='\u2022';pp.textContent=p;li.append(b,pp);ul.append(li);
    });
    sec.append(ul);box.append(sec);
  });
})();
</script>
</body>
</html>

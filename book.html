<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="site-text.js"></script>
<script src="motion.js"></script>
<title data-t="home.pageTitle"></title>
<meta name="description" content="" data-ta="content={home.metaDescription}">
<meta property="og:title" content="" data-ta="content={home.shareTitle}">
<meta property="og:description" content="" data-ta="content={home.shareDescription}">
<meta name="theme-color" content="#cfcfcf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Jost:wght@300;400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#dce8f0;--beige:#efece1;--btn:#d3e3ef;--ink:#111;--gutter:max(5.6vw,calc((100vw - 1100px)/2));
  --mono:'Courier Prime','Courier New',monospace;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--mono);color:var(--ink);background:#fff;overflow-x:hidden}
h1,h2,h3,p,figure,blockquote{margin:0}
a{color:inherit}
.serif{font-family:var(--serif)}.sans{font-family:var(--sans)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.body-text{font-size:clamp(.78rem,1.9vw,1.05rem);line-height:1.75}

/* HERO */
.hero{position:relative;height:clamp(500px,min(106vw,84vh),780px);background:linear-gradient(#a8a8a8 2%,#b6b6b6 25%,#c1c1c1 50%,#dedede 75%,#d0d0d0 98%);overflow:hidden;color:#fff}
.hero{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hero.scrubbing{cursor:ew-resize}
.hero a{-webkit-user-drag:none}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;transition:opacity .35s ease}
.hero video.fade{opacity:0}
.hero-title{position:relative;z-index:2;text-align:center;font:300 clamp(1rem,3.7vw,2.1rem)/1.2 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding:.15em .5em 0;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.logo{position:absolute;z-index:2;left:var(--gutter);top:clamp(2.6rem,7vw,4.6rem);display:flex;align-items:center;gap:.6rem;text-decoration:none;font-size:clamp(.6rem,1.9vw,.95rem);line-height:1.15;text-transform:uppercase;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.logo svg{width:1.9em;height:1.9em;flex:none}
.hero-copy{position:absolute;z-index:2;left:calc(var(--gutter) - 1.2vw);top:36%;max-width:90%}
.hero-h{font:400 clamp(1.6rem,4.5vw,3.5rem)/1.12 var(--serif);color:#f3f0ea;text-shadow:0 1px 10px rgba(0,0,0,.3)}
.pill{display:inline-block;margin:1.1rem 0 0 1.2vw;padding:.85em 2.9em;background:var(--btn);color:var(--ink);border:0;border-radius:6px;font:400 clamp(.72rem,2vw,1rem)/1 var(--serif);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.terms-link{display:inline-block;margin:1.6rem 0 0 1.4vw;color:#fff;font:400 clamp(.72rem,2vw,1rem)/1.2 var(--serif);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;text-shadow:0 1px 5px rgba(0,0,0,.4)}
.terms-link:hover{text-decoration:underline}
@media(hover:hover){.pill:hover{background:#c3d9ea;transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18)}}
.pill:active{transform:scale(.97)}

/* Wide screens: bike video sits on the right at a sensible size, fading into the grey backdrop */
@media(min-aspect-ratio:1/1){.hero-img{left:auto;right:0;width:min(58vw,760px);-webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}.hero video{left:auto;right:0;width:min(58vw,760px);object-fit:cover;object-position:50% 56%;-webkit-mask-image:linear-gradient(to right,transparent,#000 30%);mask-image:linear-gradient(to right,transparent,#000 30%)}}

/* SECTIONS */
.sec{padding-inline:var(--gutter)}
.journeys{background:var(--blue);padding-block:clamp(3rem,16vw,7rem) clamp(3rem,13vw,6rem)}
.journeys h2{font:700 clamp(1.8rem,4.9vw,3.7rem)/1.1 var(--serif);max-width:11.3em}
.journeys p{margin-top:clamp(1.6rem,6vw,3rem);max-width:27em}
.best{background:#fff;padding-block:clamp(2rem,7vw,3.6rem);display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
.best h2{font:400 clamp(1.8rem,5.5vw,4rem)/.98 var(--sans)}
.best p{font-size:clamp(.68rem,1.7vw,.95rem);line-height:1.7;max-width:22em}
/* Fleet: first row always visible; the button below slides the rest open (height animates smoothly) */
.fleet-wrap{background:var(--beige);padding-block:clamp(1rem,4.3vw,2.2rem) 0}
.fleet-clip{overflow:hidden;height:var(--h0,auto);transition:height .65s cubic-bezier(.22,.8,.22,1)}
.fleet{display:grid;grid-template-columns:repeat(3,1fr)}
.fleet-note{text-align:center;padding:1.2rem 1rem .4rem;font-size:clamp(.68rem,1.7vw,.85rem);color:#5d5d55;opacity:0;transform:translateY(8px);transition:opacity .5s .2s,transform .5s .2s}
.fleet-wrap.open .fleet-note{opacity:1;transform:none}
.fleet-bar{display:flex;justify-content:center;padding:clamp(.9rem,3vw,1.4rem) 0 clamp(1rem,3.4vw,1.8rem)}
.fleet-btn{display:inline-flex;align-items:center;gap:.6em;padding:.8em 1.7em;border:0;border-radius:999px;background:var(--btn);color:var(--ink);font:400 clamp(.74rem,2vw,.95rem)/1 var(--serif);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.fleet-btn svg{width:1.1em;height:1.1em;transition:transform .55s cubic-bezier(.22,.8,.22,1)}
.fleet-wrap.open .fleet-btn svg{transform:rotate(180deg)}
.fleet-btn:active{transform:scale(.97)}
@media(hover:hover){.fleet-btn:hover{background:#c3d9ea;transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14)}}
.tile{opacity:0;transform:translateY(14px);animation:tileIn .5s ease forwards}
@keyframes tileIn{to{opacity:1;transform:none}}
/* Package viewer: full screen on phones, video + details side by side on desktop. Video is shown whole (never cropped). */
.vw{position:fixed;inset:0;z-index:60;background:#0b0f13;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.vw.open{opacity:1;visibility:visible;transition:opacity .35s ease}
.vw-card{position:absolute;inset:0;margin:auto;width:100%;height:100%;display:flex;flex-direction:column;background:#0b0f13;overflow:hidden;color:#fff;transform:scale(.6);border-radius:28px;opacity:0;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .35s ease,border-radius .55s ease}
.vw.open .vw-card{transform:none;opacity:1;border-radius:0}
.vw-media{position:relative;flex:1 1 0;min-height:0;background:#000;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:ew-resize}
.vw-bg{position:absolute;inset:-10%;background:center/cover no-repeat;filter:blur(28px) brightness(.5) saturate(1.2);pointer-events:none}
.vw-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%;pointer-events:none}
.vw-x{position:absolute;z-index:3;top:max(.9rem,env(safe-area-inset-top));right:.9rem;width:2.6rem;height:2.6rem;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#111;font:400 1.6rem/1 var(--sans);cursor:pointer;transition:transform .2s}
.vw-x:active{transform:scale(.92)}
@media(hover:hover){.vw-x:hover{transform:rotate(90deg)}}
.vw-info{position:relative;z-index:2;flex:0 1 auto;max-height:46vh;max-height:46dvh;min-height:0;background:#0b0f13;padding:.1rem 1.3rem max(1.1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.5rem}
.vw-info::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:70px;background:linear-gradient(transparent,#0b0f13);pointer-events:none}
.vw-info>*{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s cubic-bezier(.22,.8,.22,1)}
.vw.open .vw-info>*{opacity:1;transform:none}
.vw.open .vw-info>:nth-child(1){transition-delay:.25s}.vw.open .vw-info>:nth-child(2){transition-delay:.3s}.vw.open .vw-info>:nth-child(3){transition-delay:.36s}.vw.open .vw-info>:nth-child(4){transition-delay:.42s}
.vw-track{position:relative;flex:none;height:40px;touch-action:none;cursor:pointer;pointer-events:auto}
.vw-rail{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:rgba(255,255,255,.35)}
.vw-fill{position:absolute;inset:0;border-radius:4px;background:#fff;transform-origin:left;transform:scaleX(0)}
.vw-knob{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);transform:translate(-50%,-50%);transition:width .15s,height .15s}
.vw-track.drag .vw-knob{width:28px;height:28px}
.vw-hint{flex:none;margin-top:-.35rem;font-size:.66rem;color:rgba(255,255,255,.62);line-height:1.35}
.vw-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;gap:.65rem;align-content:start;padding-right:.15rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.vw-info h3{font:700 clamp(1.5rem,7vw,2.1rem)/1.1 var(--serif);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.vw-tag{font:400 italic .98rem/1.4 var(--serif);color:#cfe3f2}
.vw-desc{font-size:.84rem;line-height:1.65;color:rgba(255,255,255,.86)}
.vw-specs{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.8rem;line-height:1.45;padding:.75rem .9rem;border-radius:12px;background:rgba(255,255,255,.07)}
.vw-specs dt{color:rgba(255,255,255,.62)}.vw-specs dd{margin:0;font-weight:700}
.vw-hl-h{margin:.1rem 0 -.25rem;font:700 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.vw-hl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.vw-hl li{padding:.38em .85em;border-radius:999px;background:rgba(255,255,255,.1);font-size:.72rem;line-height:1.2}
.vw-row{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding-top:.6rem;border-top:1px solid rgba(255,255,255,.12)}
.vw-price{font:700 .95rem/1.2 var(--serif)}
.vw-res{display:inline-block;pointer-events:auto;padding:.85em 1.8em;border-radius:6px;background:var(--btn);color:var(--ink);font:400 .85rem/1 var(--serif);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:transform .2s,background .2s}
.vw-res:active{transform:scale(.96)}
@media(hover:hover){.vw-res:hover{background:#c3d9ea}}
html.lock,html.lock body{overflow:hidden}
@media(min-width:700px) and (max-aspect-ratio:1/1){.vw-card{width:min(100%,640px)}}
@media(min-aspect-ratio:1/1) and (min-width:640px){
  .vw{background:rgba(5,8,11,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .vw-card{width:min(96vw,1180px);height:min(92vh,760px);height:min(92dvh,760px);flex-direction:row;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .vw.open .vw-card{border-radius:22px}
  .vw-info{flex:0 0 clamp(300px,34vw,410px);max-height:none;padding:3.7rem 1.4rem 1.2rem;border-left:1px solid rgba(255,255,255,.08)}
  .vw-info::before{display:none}
  .vw-info h3{font-size:clamp(1.6rem,2.6vw,2.1rem)}
}
.tile{position:relative;aspect-ratio:1.3;overflow:hidden;background:#d6d6d6;cursor:pointer;-webkit-tap-highlight-color:transparent}
.route{position:relative;aspect-ratio:1.37;overflow:hidden;background:#bcc9d2;cursor:pointer}
.tile video,.route video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease;pointer-events:none}
.tile span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-weight:700;padding:0 .5rem;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none}
.tile span{font-size:clamp(.66rem,2.1vw,1.15rem)}
.route-cap{position:absolute;inset:0;display:grid;place-items:center;padding:0 .5rem;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none}
.route-name{font-size:clamp(.8rem,2.6vw,1.3rem);letter-spacing:.04em}
.route-desc{display:none}
@media(hover:hover){.tile:hover video,.route:hover video{transform:scale(1.07)}}
.tile:focus-visible,.route:focus-visible{outline:3px solid #fff;outline-offset:-5px}
/* Route tiles: tap to open the whole video at its real shape, tap again to shrink back */
.route::after{content:"⤢";position:absolute;right:.5rem;bottom:.4rem;width:1.7rem;height:1.7rem;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.85);font-size:1rem;line-height:1;pointer-events:none}
.route.open{grid-column:1/-1;justify-self:center;width:min(100%,calc(82vh*var(--ar,1.5556)));aspect-ratio:var(--ar,1.5556);animation:fadeIn .4s ease}
.route.open::after{content:"⤡"}
.route.open{background:#000}
.route.open video{object-fit:contain;object-position:50% 50%!important;transform:none}
.route.open::after{top:.6rem;bottom:auto}
.route.open .route-cap{inset:auto 0 0 0;display:block;place-items:normal;padding:3.2rem 1.1rem 1.1rem;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.route.open .route-name{display:block;font:700 clamp(1.1rem,3.4vw,1.7rem)/1.15 var(--serif)}
.route.open .route-desc{display:block;margin-top:.4rem;max-width:42em;font-size:clamp(.72rem,1.9vw,.9rem);line-height:1.6;color:rgba(255,255,255,.92)}
.route-grid.has-open .route:not(.open){display:none}
.routes{background:var(--blue);padding-block:clamp(2.4rem,9vw,5rem) 0}
.routes .fleet-bar{padding-bottom:clamp(1.4rem,5vw,2.8rem)}
.routes.open .fleet-btn svg{transform:rotate(180deg)}
.routes h2{text-align:center;color:#fff;font:400 clamp(1.7rem,5.2vw,3.8rem)/1.1 var(--serif);margin-bottom:clamp(1.6rem,6vw,3.4rem)}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.6rem,2.4vw,1.5rem)}
.trusted{background:var(--beige);text-align:center;padding-block:clamp(2.4rem,9vw,5rem) clamp(2rem,6vw,3.6rem)}
.trusted h2{font:400 clamp(1.4rem,4vw,3rem)/1.15 var(--sans)}
.cities{margin-top:1.1rem;font:400 clamp(.74rem,3.4vw,2rem)/1.3 var(--serif);letter-spacing:.02em}
.cities i{font-style:normal;font-weight:300;margin:0 .15em}
.card{margin:clamp(1.6rem,5vw,3rem) auto 0;width:clamp(290px,52.6vw,470px);padding:clamp(1.4rem,4.4vw,2.4rem);text-align:left;border-radius:clamp(20px,3.9vw,30px);background:linear-gradient(160deg,#6fcfe0 0%,#a7c7e8 58%,#bde1ee 100%);box-shadow:0 10px 30px rgba(80,140,180,.2)}
.card h3{color:#fff;font:700 clamp(1.5rem,3.9vw,2.2rem)/1.1 var(--serif)}
.fb-in{display:block;width:100%;margin:0 0 .7rem;padding:.7rem .9rem;border:0;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink);font:400 clamp(.8rem,2.2vw,.95rem) var(--mono)}
.fb-in::placeholder{color:#6b7c88}
textarea.fb-in{resize:vertical;min-height:5.4rem}
.fb-count{margin:-.3rem .3rem .8rem 0;text-align:right;color:rgba(255,255,255,.9);font-size:.7rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.stars{display:flex;justify-content:center;gap:clamp(.5rem,2.6vw,1.1rem);margin:clamp(1.2rem,4vw,2rem) 0 clamp(1rem,3vw,1.4rem)}
.star{width:clamp(2rem,6.6vw,2.8rem);height:clamp(2rem,6.6vw,2.8rem);padding:0;border:0;background:transparent;cursor:pointer;transition:transform .15s}
.star svg{width:100%;height:100%;fill:transparent;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;transition:fill .15s}
.star.on svg{fill:#fff}
@media(hover:hover){.star:hover{transform:scale(1.18) rotate(-6deg)}}
.submit{display:block;width:100%;padding:.95em;background:#fff;color:var(--ink);border:0;border-radius:999px;font:700 clamp(1rem,2.8vw,1.3rem)/1 var(--serif);cursor:pointer;transition:transform .2s,box-shadow .2s}
@media(hover:hover){.submit:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.15)}}
.submit:disabled{opacity:.65;cursor:wait}
.fb-msg{margin-top:1rem;text-align:center;color:rgba(255,255,255,.85);font-size:clamp(.62rem,1.7vw,.8rem);min-height:1.2em}
.says{background:var(--blue);padding-block:clamp(2.4rem,9vw,5rem)}
.says h2{text-align:center;font:400 clamp(1.6rem,4.9vw,3.4rem)/1.15 var(--sans);margin-bottom:clamp(1.6rem,6vw,3.4rem)}
/* Reviews: swipe/drag sideways; new visitor comments appear first */
.rv-wrap{position:relative}
.reviews{overflow-anchor:none;display:flex;gap:clamp(.8rem,3.4vw,2rem);overflow-x:auto;padding:.4rem .2rem 1rem;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;cursor:grab}
.reviews.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.review{flex:0 0 min(82vw,22rem);scroll-snap-align:start;background:#fff;padding:clamp(1.2rem,3.8vw,2rem);min-height:clamp(11rem,31vw,15rem);display:flex;flex-direction:column;justify-content:space-between;gap:1rem;font-size:clamp(.74rem,1.6vw,.88rem);line-height:1.6;transition:transform .25s,box-shadow .25s}
.review blockquote{overflow-wrap:anywhere}
.review cite{font-style:normal;font-weight:700;overflow-wrap:anywhere}
.review .st{color:#e0a100;letter-spacing:.15em;font-size:1rem;margin-bottom:.4rem}
.rv-nav{display:flex;justify-content:center;gap:.8rem;margin-top:.4rem}
.rv-nav button{width:2.6rem;height:2.6rem;border:0;border-radius:50%;background:#fff;font-size:1.3rem;cursor:pointer;transition:transform .2s,background .2s}
.rv-nav button:hover{background:var(--btn);transform:scale(1.08)}
@media(hover:hover){.review:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(0,0,0,.12)}}
@media(min-width:760px){.review{flex-basis:calc((100% - 2*clamp(.8rem,3.4vw,2rem))/3)}}
.touch{background:var(--beige);padding-block:clamp(3rem,10vw,5.5rem) clamp(2.4rem,8vw,4.5rem)}
.touch h2{font:400 clamp(1.8rem,5.2vw,3.8rem)/1.1 var(--sans)}
.touch address{font-style:normal;margin-top:clamp(1.8rem,7vw,3.4rem)}
.touch address a{text-decoration:none}
.touch address a:hover{text-decoration:underline}
.ig{display:inline-block;margin:.6rem 0;line-height:0}
.ig svg{width:1.9rem;height:1.9rem;padding:4px;border-radius:7px;background:linear-gradient(45deg,#f9a63a,#d6249f,#6a4fd6);transition:transform .2s}
.ig:hover svg{transform:scale(1.12)}
.touch .note{margin-top:clamp(2rem,9vw,4rem);max-width:26em;font-size:clamp(.7rem,1.7vw,.9rem)}

/* MOTION */
@keyframes pop{from{opacity:.4;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:.3}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
html:not(.anim) .hero-title,html:not(.anim) .logo{animation:up .9s .1s both}html:not(.anim) .hero-copy{animation:up 1s .3s both}
.js .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none}

/* ---- HERO ANIMATION: slow zoom-out, drifting light, staggered text, bobbing scroll cue ---- */
.hero::before{content:"";position:absolute;inset:-25%;z-index:1;pointer-events:none;background:radial-gradient(38% 32% at 72% 28%,rgba(255,255,255,.34),transparent 70%),radial-gradient(30% 26% at 20% 80%,rgba(220,232,240,.28),transparent 70%)}
.cue{position:absolute;z-index:2;left:50%;bottom:1.1rem;translate:-50% 0;width:1.55rem;height:2.5rem;border:2px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.cue::after{content:"";position:absolute;left:50%;top:.45rem;width:.28rem;height:.5rem;margin-left:-.14rem;border-radius:4px;background:#fff}
html.anim:not(.ready) :is(.hero-title,.logo,.pill,.terms-link,.cue){opacity:0}
html.anim.ready .hero-title{animation:dropIn .9s .1s cubic-bezier(.2,.8,.2,1) backwards}
html.anim.ready .logo{animation:dropIn .9s .25s cubic-bezier(.2,.8,.2,1) backwards}
html.anim.ready .pill{animation:up .9s .75s cubic-bezier(.2,.8,.2,1) backwards,pillGlow 2.8s 2.6s ease-in-out infinite}
html.anim.ready .terms-link{animation:up .9s .95s cubic-bezier(.2,.8,.2,1) backwards}
html.anim.ready .cue{animation:up .9s 1.2s backwards}
html.anim.ready .cue::after{animation:cueDot 1.8s 2s ease-in-out infinite}
html.anim.ready .hero-img{animation:kb 2.8s cubic-bezier(.2,.7,.2,1) backwards}
html.anim .hero{animation:heroShift 14s ease-in-out infinite alternate;background-size:100% 160%}
html.anim .hero::before{animation:drift 16s ease-in-out infinite alternate}
@keyframes kb{from{scale:1.2}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes pillGlow{0%,100%{box-shadow:0 0 0 0 rgba(211,227,239,.55)}60%{box-shadow:0 0 0 14px rgba(211,227,239,0)}}
@keyframes cueDot{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(.9rem)}}
@keyframes heroShift{from{background-position:50% 0}to{background-position:50% 100%}}
@keyframes drift{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(5%,4%,0) scale(1.12)}}

/* ---- SECTION ANIMATION: slide / zoom variants, staggered cards, pop-in tiles ---- */
.js .reveal-l{transform:translateX(-44px)}.js .reveal-r{transform:translateX(44px)}.js .reveal-z{transform:scale(.9)}
.js .fleet-wrap.reveal{opacity:1;transform:none}
.js .fleet-wrap:not(.in) .tile{animation-play-state:paused}
@keyframes riseIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes riseIn2{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.js .routes:not(.in) .route{opacity:0}
.routes.in .route{animation:riseIn .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*.12s)}
.routes.open .route:nth-child(n+3){animation:riseIn2 .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc((var(--i,2) - 2)*.12s + .2s)}
.route.open,.routes.in .route.open{animation:fadeIn .4s ease}
.js .cities span,.js .cities i{display:inline-block;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*.1s + .15s)}
.js .cities.in span,.js .cities.in i{opacity:1;transform:none}
.js .card:not(.in) .star{opacity:0}
.card.in .star{animation:starPop .6s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:calc(var(--i,0)*.09s + .35s)}
@keyframes starPop{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
.js .says:not(.in) .review{opacity:0}
.says.in .review{animation:riseIn .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*.13s)}
.review:nth-child(1){--i:0}.review:nth-child(2){--i:1}.review:nth-child(3){--i:2}.review:nth-child(4){--i:3}.review:nth-child(5){--i:4}.review:nth-child(n+6){--i:5}
.pill,.vw-res,.fleet-btn,.submit{position:relative;overflow:hidden}
.pill::after,.vw-res::after,.fleet-btn::after,.submit::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .7s ease;pointer-events:none}
@media(hover:hover){.pill:hover::after,.vw-res:hover::after,.fleet-btn:hover::after,.submit:hover::after{left:130%}}
.tile{transition:box-shadow .4s}
@media(hover:hover){.tile:hover,.route:not(.open):hover{box-shadow:0 14px 30px rgba(0,0,0,.22);z-index:1}}
@media(prefers-reduced-motion:reduce){.tile{opacity:1;transform:none}html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.js .reveal{opacity:1;transform:none}}

<script>
/* ============ THE PACKAGE CARDS ============
   Only the video file names are here. The WORDS (names, details) are in site-text.js.
   The first 3 show in a row; the "View all" button slides the rest open below. */
var FLEET=[
  {pkg:'private',    src:'bike-aerox.mp4',  poster:'bike-aerox.jpg'},
  {pkg:'camping',    src:'bike-hunter.mp4', poster:'bike-hunter.jpg'},

<script>
(function(){
  var d=document,$=function(i){return d.getElementById(i)};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var beh=reduce?'auto':'smooth';
  d.documentElement.classList.add('js');
  function PK(b){return TEXT.packages[b.pkg]||{}}   /* words for a package card come from site-text.js */

  /* ---- words that are built by script ---- */
  $('cities').innerHTML=TEXT.home.cities.map(function(){return'<span></span>'}).join('<i>|</i>');
  [].forEach.call($('cities').querySelectorAll('span'),function(sp,i){sp.textContent=TEXT.home.cities[i]});
  [].forEach.call($('cities').children,function(c,i){c.style.setProperty('--i',i)});
  [].forEach.call(d.querySelectorAll('.star'),function(s,i){
    s.setAttribute('aria-label',i===0?T('home.oneStarAria'):T('home.manyStarsAria',{n:i+1}));s.style.setProperty('--i',i);
  });
  $('fbCount').textContent=T('home.letterCount',{n:0});
  (function(){          /* the example reviews */
    var box=d.getElementById('reviews');
    TEXT.home.reviews.forEach(function(r){
      var f=d.createElement('figure');f.className='review static';
      var q=d.createElement('blockquote');q.textContent='"'+r.quote+'"';
      var c=d.createElement('cite');c.textContent='— '+r.by;
      f.append(q,c);box.append(f);
    });
  })();

  /* ---- scroll reveal ---- */
  var items=[].slice.call(d.querySelectorAll('.reveal,.io'));
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
    items.forEach(function(el){io.observe(el)});
  } else items.forEach(function(el){el.classList.add('in')});

  /* ---- videos: play only while visible ---- */
  var vo=null;
  if(!reduce && 'IntersectionObserver' in window){
    vo=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){var p=v.play();if(p&&p.catch)p.catch(function(){})}else v.pause()})},{threshold:.1});
  }
  function watch(v){v.muted=true;if(reduce){v.removeAttribute('autoplay');v.pause()}else if(vo)vo.observe(v)}

  /* ---- sideways scrolling with the mouse (touch already scrolls with momentum) ---- */
  function dragScroll(el){
    var down=false,moved=false,sx=0,sl=0,lx=0,lt=0,vel=0,raf=0;
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse'||e.button!==0)return;
      cancelAnimationFrame(raf);down=true;moved=false;sx=lx=e.clientX;sl=el.scrollLeft;lt=performance.now();vel=0;
    });
    addEventListener('pointermove',function(e){
      if(!down)return;var dx=e.clientX-sx;
      if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add('dragging')}
      if(!moved)return;
      el.scrollLeft=sl-dx;
      var t=performance.now(),dt=Math.max(1,t-lt);vel=.8*vel+.2*((lx-e.clientX)/dt);lx=e.clientX;lt=t;
    });
    addEventListener('pointerup',function(){
      if(!down)return;down=false;el.classList.remove('dragging');
      if(!moved)return;
      (function step(){el.scrollLeft+=vel*16;vel*=.95;if(Math.abs(vel)>.03)raf=requestAnimationFrame(step)})();   /* harder flick = further glide */
    });
    el.addEventListener('wheel',function(){cancelAnimationFrame(raf)},{passive:true});
    el.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  }

  /* ---- smooth scrubbing: swipe sideways over a video to move it back / forward (no visible buttons) ---- */
  function seeker(v){
    var tgt=0,on=false;
    v.addEventListener('seeked',function(){if(on&&Math.abs(v.currentTime-tgt)>.04)v.currentTime=tgt});
    return{to:function(t){tgt=t;if(!v.seeking)v.currentTime=t},active:function(a){on=a}};
  }
  function wrapT(t,dur){return((t%dur)+dur)%dur}
  function attachScrub(el,v,sk,ignore){
    var down=false,moved=false,sx=0,sy=0,st=0,w=1,was=false,stamp=0;
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      if(ignore&&e.target.closest(ignore))return;
      down=true;moved=false;sx=e.clientX;sy=e.clientY;st=v.currentTime;w=el.getBoundingClientRect().width||1;
    });
    el.addEventListener('pointermove',function(e){
      if(!down)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!moved){
        if(Math.abs(dx)<8)return;
        if(Math.abs(dy)>Math.abs(dx)){down=false;return}
        moved=true;was=!v.paused;v.pause();sk.active(true);
        try{el.setPointerCapture(e.pointerId)}catch(_){}
        el.classList.add('scrubbing');
      }
      var dur=v.duration;if(!dur||!isFinite(dur))return;
      sk.to(wrapT(st+dx/w*dur,dur));     /* a full-width swipe = the whole video; right = forward, left = back */
    });
    function end(){
      if(!down)return;down=false;
      if(moved){
        stamp=Date.now();sk.active(false);el.classList.remove('scrubbing');
        if(was&&!(reduce&&el.id==='top')){var p=v.play();if(p&&p.catch)p.catch(function(){})}
      }
    }
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
    el.addEventListener('click',function(e){if(Date.now()-stamp<350){e.preventDefault();e.stopPropagation()}},true);
  }

  /* ---- hero video: slide over it to scrub ---- */


  var fleet=$('fleet');
  var PRICES=null;                    /* prices come from pricing.json so they are never typed twice */
  fetch('pricing.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){PRICES=j.packages||null}).catch(function(){});

  /* ---- bike viewer ---- */
  var vbg=$('vwBg'),vw=$('vw'),vcard=$('vwCard'),vmedia=$('vwMedia'),vv=$('vwVideo'),vtrack=$('vwTrack'),vfill=$('vwFill'),vknob=$('vwKnob'),vclose=$('vwClose'),vsk=seeker(vv),vopen=false,vraf=0,lastTile=null;
  attachScrub(vcard,vv,vsk,'.vw-track,.vw-x,.vw-res,.vw-scroll');
  function tick(){
    if(!vopen)return;
    var dur=vv.duration,p=dur&&isFinite(dur)?vv.currentTime/dur:0;
    vfill.style.transform='scaleX('+p+')';vknob.style.left=(p*100)+'%';vtrack.setAttribute('aria-valuenow',Math.round(p*100));
    vraf=requestAnimationFrame(tick);
  }
  (function(){            /* the slider: drag the knob or tap the bar */
    var drag=false,was=false;
    function set(e){var r=vtrack.querySelector('.vw-rail').getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),dur=vv.duration;if(dur&&isFinite(dur))vsk.to(Math.min(dur-.05,p*dur))}
    vtrack.addEventListener('pointerdown',function(e){drag=true;was=!vv.paused;vv.pause();vsk.active(true);vtrack.classList.add('drag');try{vtrack.setPointerCapture(e.pointerId)}catch(_){}set(e)});
    vtrack.addEventListener('pointermove',function(e){if(drag)set(e)});
    function up(){if(!drag)return;drag=false;vsk.active(false);vtrack.classList.remove('drag');if(was){var p=vv.play();if(p&&p.catch)p.catch(function(){})}}
    vtrack.addEventListener('pointerup',up);vtrack.addEventListener('pointercancel',up);
    vtrack.addEventListener('keydown',function(e){var k=e.key==='ArrowRight'?.5:e.key==='ArrowLeft'?-.5:0;if(!k)return;e.preventDefault();var dur=vv.duration||8;vsk.to(wrapT(vv.currentTime+k,dur))});
  })();
  function fill(id,txt){var e=$(id);e.textContent=txt||'';e.style.display=txt?'':'none'}
  function openBike(i,tile){
    var b=FLEET[i],p=PK(b);lastTile=tile;
    vv.poster='videos/'+b.poster;vv.src='videos/'+b.src;vv.load();
    vbg.style.backgroundImage='url("videos/'+b.poster+'")';
    fill('vwName',p.name);fill('vwTag',p.tagline);fill('vwDesc',p.description);
    var sp=$('vwSpecs');sp.innerHTML='';
    (p.info||[]).forEach(function(r){var dt=d.createElement('dt'),dd=d.createElement('dd');dt.textContent=r[0];dd.textContent=r[1];sp.append(dt,dd)});
    sp.style.display=(p.info&&p.info.length)?'':'none';
    var hl=p.highlights||p.inclusions||[],ul=$('vwHl');ul.innerHTML='';
    hl.forEach(function(t){var li=d.createElement('li');li.textContent=t;ul.append(li)});
    fill('vwHlHead',hl.length?(p.highlightsLabel||T('home.popupHighlights')):'');ul.style.display=hl.length?'':'none';
    var pr=PRICES&&PRICES[b.pkg];fill('vwPrice',pr&&pr.adultPrice?T('home.priceFrom',{price:inr(pr.adultPrice)}):'');
    $('vwScroll').scrollTop=0;
    var pk=b.pkg||'';$('vwRes').href='reserve.html?package='+encodeURIComponent(pk);        /* the booking flow loads this package */
    try{sessionStorage.setItem('kcPackage',pk)}catch(_){}
    var r=tile.getBoundingClientRect();
    vcard.style.transformOrigin=(r.left+r.width/2)+'px '+(r.top+r.height/2)+'px';   /* grows out of the tile that was tapped */

    vopen=true;requestAnimationFrame(function(){vw.classList.add('open');vclose.focus({preventScroll:true})});
    var p=vv.play();if(p&&p.catch)p.catch(function(){});
    cancelAnimationFrame(vraf);tick();
  }
  function closeBike(){
    if(!vopen)return;vopen=false;vw.classList.remove('open');vw.setAttribute('aria-hidden','true');d.documentElement.classList.remove('lock');
    setTimeout(function(){if(!vopen){vv.pause();vv.removeAttribute('src');vv.load()}},400);
    if(lastTile)lastTile.focus({preventScroll:true});
  }
  vclose.addEventListener('click',closeBike);
  vw.addEventListener('click',function(e){if(e.target===vw)closeBike()});
  d.addEventListener('keydown',function(e){
    if(!vopen)return;
    if(e.key==='Escape')closeBike();
    else if(e.key==='Tab'){var f=[].slice.call(vw.querySelectorAll('button,a[href],[tabindex="0"]'));if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&d.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&d.activeElement===z){e.preventDefault();a.focus()}}
  });

  function renderFleet(){
    fleet.innerHTML='';
    FLEET.forEach(function(b,i){
      var t=d.createElement('div');t.className='tile';t.tabIndex=0;t.setAttribute('role','button');
      t.style.animationDelay=i*0.1+'s';
      t.setAttribute('aria-label',T('home.openCardAria',{name:PK(b).name||''}));
      var v=d.createElement('video');v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-hidden','true');
      v.poster='videos/'+b.poster;v.src='videos/'+b.src;v.style.objectPosition='50% 58%';
      var sp=d.createElement('span');sp.textContent=PK(b).name||'';
      t.append(v,sp);
      t.addEventListener('click',function(){openBike(i,t)});
      t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openBike(i,t)}});
      fleet.append(t);watch(v);
    });
  }
  window.renderFleet=renderFleet;
  renderFleet();

  /* ---- explore section: waterfall / cave / river / forest, first row + animated "view all" ---- */
  var ROUTES=TEXT.home.explore||[],RPREV=2,rexp=false;
  var grid=$('routeGrid'),rsec=$('routesSec'),rclip=$('routeClip'),rinner=$('routeInner'),rbtn=$('routeBtn'),rbtxt=$('routeBtnTxt');
  function sizeRoutes(){
    var any=grid.classList.contains('has-open'),first=grid.children[0];
    rclip.style.setProperty('--h0',((rexp||any)?rinner.scrollHeight:(first?first.offsetHeight:0))+'px');
  }
  function setRoutesExpanded(x){
    rexp=x;rsec.classList.toggle('open',x);rbtn.setAttribute('aria-expanded',x);
    rbtxt.textContent=x?T('home.showLess'):T('home.viewAllWithCount',{count:ROUTES.length});
    [].forEach.call(grid.children,function(t,i){var hide=!x&&i>=RPREV;t.tabIndex=hide?-1:0;t.setAttribute('aria-hidden',hide?'true':'false')});
    sizeRoutes();
    if(!x){var r=rsec.getBoundingClientRect();if(r.top<0)rsec.scrollIntoView({block:'start',behavior:beh})}
  }
  ROUTES.forEach(function(r,i){
    var t=d.createElement('div');t.className='route';t.tabIndex=0;t.setAttribute('role','button');t.setAttribute('aria-expanded','false');
    t.style.setProperty('--i',i);t.setAttribute('aria-label',T('home.videoOpenAria',{name:r.name}));
    var v=d.createElement('video');v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-hidden','true');
    v.poster='videos/'+r.fallback+'.jpg';v.style.objectPosition=r.pos||'50% 60%';
    [r.video,r.fallback].forEach(function(n,k){if(!n||(k&&n===r.video))return;var so=d.createElement('source');so.src='videos/'+n+'.mp4';so.type='video/mp4';v.append(so)});
    if(r.video&&r.video!==r.fallback){var im=new Image();im.onload=function(){v.poster='videos/'+r.video+'.jpg'};im.src='videos/'+r.video+'.jpg'}
    var pi=new Image();pi.onload=function(){if(!t.style.getPropertyValue('--ar')&&pi.naturalWidth){t.style.setProperty('--ar',(pi.naturalWidth/pi.naturalHeight).toFixed(4));sizeRoutes()}};pi.src=v.poster;
    function ar(){if(v.videoWidth){t.style.setProperty('--ar',(v.videoWidth/v.videoHeight).toFixed(4));sizeRoutes()}}
    v.addEventListener('loadedmetadata',function(){
      if(r.start&&!v._s&&v.currentSrc.indexOf('/'+r.fallback+'.mp4')>-1){v._s=1;try{v.currentTime=r.start}catch(_){}}
      ar();
    });
    var cap=d.createElement('div');cap.className='route-cap';
    var nm=d.createElement('span');nm.className='route-name';nm.textContent=r.name;
    var ds=d.createElement('p');ds.className='route-desc';ds.textContent=r.desc||'';
    cap.append(nm,ds);t.append(v,cap);grid.append(t);watch(v);
    function toggle(){
      var open=t.classList.toggle('open');
      t.setAttribute('aria-expanded',open);t.setAttribute('aria-label',T(open?'home.videoShrinkAria':'home.videoOpenAria',{name:r.name}));
      grid.classList.toggle('has-open',open);sizeRoutes();
      if(open){t.scrollIntoView({block:'center',behavior:beh});var pp=v.play();if(pp&&pp.catch)pp.catch(function(){})}
    }
    t.addEventListener('click',toggle);
    t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  });
  $('routeBar').style.display=ROUTES.length>RPREV?'':'none';
  rbtn.addEventListener('click',function(){setRoutesExpanded(!rexp)});
  setRoutesExpanded(false);
  if('ResizeObserver' in window)new ResizeObserver(sizeRoutes).observe(rinner);
  addEventListener('resize',sizeRoutes);addEventListener('load',sizeRoutes);setTimeout(sizeRoutes,300);

  /* ---- star rating + comment ---- */
  var stars=[].slice.call(d.querySelectorAll('.star')),rating=0,msg=$('fbMsg'),btn=$('fbBtn'),txt=$('fbText');
  var STAR='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
  function paint(n){stars.forEach(function(s,j){s.classList.toggle('on',j<n)})}
  stars.forEach(function(s,i){
    s.innerHTML=STAR;
    s.addEventListener('click',function(){rating=i+1;paint(rating);stars.forEach(function(x,j){x.setAttribute('aria-checked',j===i)})});
    s.addEventListener('mouseenter',function(){paint(i+1)});
    s.addEventListener('mouseleave',function(){paint(rating)});
  });
  txt.addEventListener('input',function(){$('fbCount').textContent=T('home.letterCount',{n:txt.value.length})});

  /* ---- reviews (newest visitor comments first, built with textContent so nothing can inject HTML) ---- */
  var rv=$('reviews');
  function card(r){
    var f=d.createElement('figure');f.className='review';
    if(r.rating){var st=d.createElement('div');st.className='st';st.setAttribute('aria-label',T('home.starsOutOfFiveAria',{n:r.rating}));st.textContent='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);f.append(st)}
    var q=d.createElement('blockquote');q.textContent=r.comment;
    var c=d.createElement('cite');c.textContent='— '+(r.name||T('home.defaultReviewer'));
    var box=d.createElement('div');box.append(q);
    f.append(box,c);return f;
  }
  function showReviews(list){
    [].slice.call(rv.querySelectorAll('.review:not(.static)')).forEach(function(n){n.remove()});
    var first=rv.querySelector('.static');
    list.forEach(function(r){rv.insertBefore(card(r),first)});
    rv.scrollLeft=0;
  }
  fetch('api/feedback').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(l){if(Array.isArray(l))showReviews(l)}).catch(function(){});
  dragScroll(rv);
  function step(dir){var c=rv.querySelector('.review'),gap=parseFloat(getComputedStyle(rv).columnGap)||16;rv.scrollBy({left:dir*(c.offsetWidth+gap),behavior:beh})}
  $('rvPrev').addEventListener('click',function(){step(-1)});
  $('rvNext').addEventListener('click',function(){step(1)});

  btn.addEventListener('click',function(){
    if(!rating){msg.textContent=T('home.tapStarFirst');return}
    var body={rating:rating,name:$('fbName').value.trim(),comment:txt.value.trim(),website:$('fbWeb').value};
    btn.disabled=true;btn.textContent=T('home.sending');
    fetch('api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||'');return j})})
      .then(function(){
        if(body.comment){
          rv.insertBefore(card({rating:body.rating,name:body.name,comment:body.comment}),rv.firstChild);
          rv.scrollTo({left:0,behavior:beh});
          msg.textContent=T('home.thanksWithComment');
        } else msg.textContent=T('home.thanksNoComment');
        rating=0;paint(0);stars.forEach(function(x){x.setAttribute('aria-checked','false')});
        $('fbName').value='';txt.value='';$('fbCount').textContent=T('home.letterCount',{n:0});
      })
      .catch(function(e){msg.textContent=e.message||T('home.sendFailed')})
      .then(function(){btn.disabled=false;btn.textContent=T('home.submitFeedback')});
  });
})();
</script>
</body>
</html>
